yaml
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PickleSound.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickleSound-apk
          path: PickleSound.apk

      - name: Publish to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: PickleSound build ${{ github.run_number }}
          files: PickleSound.apk
